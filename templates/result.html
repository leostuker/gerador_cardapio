<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados - Gerador de Cardápio</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; color: #333; margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 1000px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #1b5a32; }
        .grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 20px; }
        .card { border: 1px solid #ccc; padding: 10px; border-radius: 8px; background: #fafafa; }
        img { max-width: 100%; height: auto; max-height: 400px; border: 1px solid #ddd; }
        a.btn { display: block; background: #1b5a32; color: white; text-decoration: none; padding: 10px; margin-top: 10px; border-radius: 4px; font-weight: bold; }
        a.btn:hover { background: #144426; }
        a.btn-back { display: inline-block; margin-top: 30px; color: #1b5a32; font-weight: bold; text-decoration: none; }
        a.btn-back:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Imagens Geradas</h1>
        <p>Clique no botão abaixo de cada imagem para fazer o download.</p>
        
        <div class="grid">
            {% for file in files %}
            <div class="card">
                <img src="{{ url_for('static', filename='output/' + file) }}" alt="{{ file }}">
                <a class="btn" href="{{ url_for('download', filename=file) }}" download>Baixar {{ file }}</a>
            </div>
            {% endfor %}
        </div>
        
        <a class="btn-back" href="/">&larr; Voltar e Gerar Novamente</a>
    </div>
</body>
</html>
